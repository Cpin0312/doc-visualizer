<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>資料を図にする（DocVisualizer）</title>
<!-- DocVisualizer 0.1.0 ／ 完全オフライン：外へは何も読みこまず、何も送らない -->
<style>:root {
  --font: "Yu Gothic UI", "Meiryo", "Hiragino Sans", system-ui, sans-serif;
  --bg: #f4f6fa; --card: #ffffff; --text: #1f2a37; --sub: #5b6675; --line: #d9e0ea;
  --accent: #3b6fd8; --red: #d64545; --yellow: #c98f00; --green: #2f9e5b;
  --fs: 15px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs); line-height: 1.6; }
button, select, input { font-family: inherit; font-size: 0.93rem; }
.bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); }
.app-title { font-size: 1.05rem; margin: 0 10px 0 0; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; min-height: 34px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:focus-visible, .item:focus-visible { outline: 3px solid #9bb8f0; outline-offset: 2px; }
.btn:disabled { color: #a3abb7; cursor: not-allowed; background: #f7f8fa; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
.btn[aria-pressed="true"] { background: #e6eefc; border-color: var(--accent); font-weight: bold; }
.group { display: inline-flex; gap: 2px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 80px; }
.welcome { margin-top: 8vh; padding: 40px; border: 2px dashed var(--line); border-radius: 16px; background: #fff; text-align: center; color: var(--sub); }
.welcome h2 { color: var(--text); }
.status { color: var(--sub); font-size: 0.85rem; margin: 0; }
.doc-title { font-size: 1.7rem; margin: 4px 0 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 12px; padding: 12px 16px; }
.card h3 { margin: 0 0 4px; font-size: 0.85rem; color: var(--sub); }
.card p { margin: 0; font-size: 1.15rem; font-weight: bold; white-space: pre-wrap; }
.card.conclusion { border-left-color: var(--green); }
.card.todo { border-left-color: var(--yellow); }
.diagram-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; }
.diagram-box h2 { margin: 0 0 8px; font-size: 1.2rem; }
.diagram-box h2 .kind { font-size: 0.75rem; color: var(--sub); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; font-weight: normal; }
.svg-wrap { overflow-x: auto; }
.svg-wrap svg { display: block; height: auto; max-width: 100%; margin: 0 auto; }
.svg-wrap.wide svg { max-width: none; }
.item { cursor: pointer; }
.item:hover .box { filter: drop-shadow(0 2px 6px rgba(59, 111, 216, .35)); }
.item.sel .box { stroke: var(--accent) !important; stroke-width: 3.5 !important; }
.legend, .warnings, .body-text, .guide { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; }
.legend h2, .warnings h2, .body-text > h2.sec, .guide h2 { font-size: 1rem; margin: 0 0 6px; }
.legend ul { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; font-size: 0.9rem; }
.chip { display: inline-block; min-width: 14px; height: 14px; border-radius: 7px; vertical-align: -2px; margin-right: 5px; }
.warnings ul { margin: 0; padding-left: 1.2em; font-size: 0.9rem; }
.warnings .k { display: inline-block; font-size: 0.75rem; border-radius: 4px; padding: 0 5px; margin-right: 6px; color: #fff; background: var(--red); }
.warnings .k.fix { background: var(--yellow); }
.body-text table, .panel table { border-collapse: collapse; margin: 6px 0; }
.body-text td, .body-text th, .panel td, .panel th { border: 1px solid var(--line); padding: 3px 8px; }
pre { background: #f2f4f8; padding: 8px 10px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
.guide pre { white-space: pre-wrap; }
.panel { position: fixed; right: 14px; top: 70px; bottom: 14px; width: min(380px, calc(100vw - 28px)); overflow-y: auto; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(31, 42, 55, .18); padding: 16px 18px; }
.panel h2 { margin: 0 36px 8px 0; font-size: 1.25rem; }
.panel .close { position: absolute; right: 10px; top: 10px; min-height: 30px; padding: 0 10px; }
.panel .src { margin-top: 12px; padding: 8px 10px; background: #f2f6fd; border-radius: 8px; font-size: 0.88rem; }
.panel .empty { color: var(--sub); font-size: 0.9rem; }
.badge { display: inline-block; color: #fff; border-radius: 99px; padding: 0 9px; font-size: 0.8rem; font-weight: bold; margin: 0 4px 4px 0; }
.badge.red { background: var(--red); } .badge.yellow { background: var(--yellow); } .badge.green { background: var(--green); }
.error { position: sticky; top: 51px; z-index: 19; background: var(--red); color: #fff; padding: 8px 16px; font-weight: bold; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; background: #1f2a37; color: #fff; padding: 10px 18px; border-radius: 10px; max-width: 90vw; }
.secret { position: fixed; left: 14px; bottom: 14px; z-index: 25; border: 2px solid var(--red); color: var(--red); background: #fff; font-weight: bold; padding: 2px 12px; border-radius: 6px; pointer-events: none; }
.drop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(59, 111, 216, .15); border: 4px dashed var(--accent); font-size: 1.6rem; font-weight: bold; color: var(--accent); pointer-events: none; }
[hidden] { display: none !important; }
#print { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- 印刷（PDF）：A4 横。ページ番号と社外秘の印は、各ページの中に描く ---- */
@page { size: A4 landscape; margin: 0; }
@media print {
  html, body { background: #fff; font-size: 14px; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.page { position: relative; width: 297mm; height: 209mm; padding: 14mm 16mm 16mm; overflow: hidden; break-after: page; page-break-after: always; background: #fff; }
.page:last-child { break-after: auto; page-break-after: auto; }
.page h1 { font-size: 26px; margin: 0 0 12px; }
.page h2 { font-size: 19px; margin: 0 0 8px; }
.page .p-secret { position: absolute; right: 16mm; top: 6mm; border: 2px solid var(--red); color: var(--red); font-weight: bold; padding: 0 10px; border-radius: 5px; font-size: 13px; }
.page .p-foot { position: absolute; left: 16mm; right: 16mm; bottom: 6mm; display: flex; justify-content: space-between; color: var(--sub); font-size: 11px; border-top: 1px solid var(--line); padding-top: 2mm; }
.page .p-fig { width: 100%; height: 150mm; display: flex; align-items: center; justify-content: center; }
.page .p-fig svg { max-width: 100%; max-height: 100%; }
.page .cards { grid-template-columns: 1fr; }
.page .p-note { margin: 0 0 10px; padding: 0 0 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
.page .p-note h3 { margin: 0 0 2px; font-size: 15px; }
.page .p-note .src { color: var(--sub); font-size: 12px; }
.page .p-legend { font-size: 12px; color: var(--sub); margin-top: 4px; }
.page .p-list { font-size: 14px; }
</style>
</head>
<body>
<header class="bar">
  <h1 class="app-title">資料を図にする</h1>
  <label class="btn primary" for="file" id="pickLabel" tabindex="0" role="button" title="md ファイルを選ぶ（画面にドラッグ＆ドロップでもよい）">md を選ぶ</label>
  <input id="file" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden>
  <select id="sample" class="btn" aria-label="見本を開く"><option value="">見本を開く…</option></select>
  <span class="sep"></span>

    <button class="btn fs" type="button" data-fs="13" aria-pressed="false">小</button>
    <button class="btn fs" type="button" data-fs="15" aria-pressed="true">中</button>
    <button class="btn fs" type="button" data-fs="18" aria-pressed="false">大</button>
  </span>
  <button id="present" class="btn" type="button" disabled title="発表は次の版（R2）で入れる">発表</button>

  <button id="pptx" class="btn" type="button" disabled title="PowerPoint は次の版（R3）で入れる">PowerPoint</button>
  <button id="copyPrompt" class="btn" type="button" title="Copilot に貼る指示文をコピーする">Copilot 用の指示をコピー</button>
</header>
<div id="error" class="error" role="alert" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="secret" class="secret" hidden></div>
<main id="main">
  <section id="welcome" class="welcome">
    <h2>md ファイルを選ぶか、ここにドラッグ＆ドロップしてください</h2>
    <p>中身はこの画面の中だけで読みます。どこにも送らず、ブラウザにも残しません。</p>
    <p>md の作り方：「Copilot 用の指示をコピー」を押して Copilot に貼り、職場の資料を渡すと、この形の md を作ってくれます。まずは「見本を開く」で試せます。</p>
  </section>
  <div id="doc" hidden>
    <p id="status" class="status"></p>
    <h1 id="title" class="doc-title"></h1>
    <div id="cards" class="cards"></div>
    <div id="diagrams"></div>
    <section id="legend" class="legend" hidden></section>
    <section id="warnings" class="warnings" hidden></section>
    <section id="body" class="body-text" hidden></section>
    <section id="guide" class="guide" hidden></section>
  </div>
</main>
<aside id="panel" class="panel" hidden aria-live="polite">
  <button id="panelClose" class="btn close" type="button" aria-label="閉じる">×</button>
  <div id="panelBody"></div>
</aside>

<script>
window.DV_SAMPLES = [{"name":"01_flow.md","title":"flow：注文を受けてから送るまで（架空の例）","text":"# 注文を受けてから送るまで（架空の例）\n> ひとことで：注文は「受付 → 確認 → 見積 → 承認 → 発送」の5つで進む\n> 結論：見積は3日以内に出す。承認は課長まで\n> すること：差し戻しの理由を毎回書きのこす\n> 社外秘：社外秘\n\n```flow 注文の流れ\n受付 -> 確認 -> 見積\n見積 -> 承認 : OK\n見積 -> 受付 : 差し戻し\n承認 -> 発送 +完了\n承認 !期限\n確認 ?在庫\n```\n\n## 受付\nお客様から電話かメールで受ける。受けた日を台帳に書く。\n[元：注文の手順（架空）2ページ]\n\n## 見積\n在庫と値段を見て、3日以内に出す。\n- 値引きは 5% まで\n- それより大きい値引きは課長に相談\n[元：注文の手順（架空）4ページ]\n\n## 承認\n課長が見て OK を出す。期限は見積から2日。\n"},{"name":"02_lanes.md","title":"lanes：経費の精算（架空の例）","text":"# 経費の精算（架空の例）\n> ひとことで：申請者が出して、上長と経理の2回の確認で振り込まれる\n> すること：領収書は月末までに出す\n\n```lanes 精算の担当\n[申請者] 申請 -> [上長] 確認 -> [経理] 点検 -> 振込 +完了\n[上長] 確認 -> [申請者] 申請 : 差し戻し\n[経理] 点検 !月末締め\n```\n\n## 点検\n領収書と金額が合っているかを見る。\n[元：経費のきまり（架空）第3条]\n"},{"name":"03_timeline.md","title":"timeline：新しい道具を入れる日程（架空の例）","text":"# 新しい道具を入れる日程（架空の例）\n> ひとことで：12月に説明会、1月から使い始める\n> 結論：説明会の申しこみは 11/30 まで\n\n```timeline 入れるまでの日程\n2026-11-30 申しこみ締め切り !期限\n2026-12-03 説明会\n2026-12-07〜2026-12-18 試しに使う\n2026-12-25 ふりかえり ?日程調整\n2027-01-05 使い始め +開始\n```\n\n## 説明会\n会議室Aで 14 時から。オンラインでも見られる。\n[元：お知らせメール（架空）]\n"},{"name":"04_tree.md","title":"tree：問い合わせが多い理由（架空の例）","text":"# 問い合わせが多い理由（架空の例）\n> ひとことで：問い合わせの半分は「使い方が分からない」から\n\n```tree 理由の分けかた\n- 問い合わせが多い\n  - 使い方が分からない\n    - 説明書が古い !問題\n    - 画面が分かりにくい\n  - 動かない\n    - 設定のまちがい\n    - 本当の故障 ?確認中\n  - そのほか\n```\n\n## 説明書が古い\n最後に直したのが2年前。画面が変わっている。\n[元：問い合わせの記録（架空）]\n"},{"name":"05_chart.md","title":"chart：問い合わせの件数（架空の例）","text":"# 問い合わせの件数（架空の例）\n> ひとことで：7月から減っている\n\n```chart 月ごとの問い合わせ（件）\n4月 : 1,200\n5月 : 1,350\n6月 : 1,480 !いちばん多い\n7月 : 1,100\n8月 : 920 +目標達成\n```\n\n## 6月\n新しい画面を出した月。問い合わせが増えた。\n[元：月の報告（架空）6月号]\n"},{"name":"06_kpi.md","title":"kpi：今月の数字（架空の例）","text":"# 今月の数字（架空の例）\n> ひとことで：売上は伸び、解約は減った\n\n```kpi 今月の大事な数字\n売上 : 1,200万円 : 前年比 +8%\n新しいお客様 : 42社 : 先月より +5\n解約率 : 2.1% : 前年比 ▲0.3pt\n問い合わせ : 920件 : 先月より -180 !確認\n```\n\n## 売上\n大きな注文が2件あった。\n[元：月の報告（架空）]\n"},{"name":"07_compare.md","title":"compare：3つの案をくらべる（架空の例）","text":"# 3つの案をくらべる（架空の例）\n> 結論：案Bにする\n\n```compare 道具の案\n| 項目 | 案A | 案B | 案C |\n|---|---|---|---|\n| 値段 | × 高い | ◎ 安い | ○ ふつう |\n| 使いやすさ | ○ | ○ | △ 慣れが要る |\n| 入れるまでの日数 | 3か月 | ◎ 1か月 | 2か月 |\n| 支え（サポート） | ○ 電話あり | △ メールだけ | × なし |\n```\n\n## 値段\n1年あたりの費用で比べた。\n[元：見積の比較表（架空）]\n"},{"name":"08_copilot_wrapped.md","title":"copilot_wrapped：新しい受付のしくみ（架空の例・Copilot の出し方）","text":"はい、資料をこのフォーマットにまとめました。\n```markdown\n# 新しい受付のしくみ（架空の例・Copilot の出し方）\n> ひとことで：受付を1つの窓口にまとめ、3か月で切りかえる\n> 結論：12月に説明会、1月から使う\n> すること：各課は担当者を1人決める\n> 社外秘：関係者限り\n\n~~~flow 受付の流れ\n受付 -> 振り分け -> 対応 -> 完了 +完了\n振り分け -> 受付 : 情報不足\n対応 !期限\n~~~\n\n~~~lanes 担当ごと\n[窓口] 受付 -> [各課] 対応 -> [窓口] 返事\n~~~\n\n~~~timeline 日程\n2026-12-03 説明会\n2027-01-05 使い始め !期限\n~~~\n\n~~~tree 窓口の分け方\n- 窓口\n  - 電話\n  - メール\n  - 対面\n~~~\n\n~~~chart 月の受付（件）\n10月 : 300\n11月 : 340\n12月 : 410\n~~~\n\n~~~kpi 目ざす数字\n返事まで : 2日 : いまは 4日\n満足度 : 85% : 前年比 +5%\n~~~\n\n~~~compare 窓口の案\n| 項目 | いまのまま | 1つにまとめる |\n|---|---|---|\n| 手間 | × 多い | ◎ 少ない |\n| 費用 | ○ なし | △ 少しかかる |\n~~~\n\n## 受付\n電話・メール・対面のどれで来ても、同じ台帳に書く。\n[元：受付の見直し案（架空）3ページ]\n\n## 振り分け\n内容を見て、担当の課に回す。\n[元：受付の見直し案（架空）5ページ]\n```\nほかに直したいところがあれば教えてください。\n"},{"name":"09_mistakes.md","title":"mistakes：わざとまちがえた見本（架空の例）","text":"# わざとまちがえた見本（架空の例）\n> ひとことで：書きまちがいがあっても、読める所は図になる\n\n```流れ　手続き\n申しこみ　→　確認　⇒　受付\n確認 ー> 返事：OK\n-> だれもいない\n受付 ！急ぎ\n```\n\n```日程\n2026/12/1　説明会\n12/15 締め切り ！期限\n2026-13-40 ない日\nあした 何か\n```\n\n```数字 件数（件）\n１月 ： １２０\n2月 : 1.2万\n3月 : たくさん\n```\n\n```比べる\n| 項目 | 案A | 案B |\n| 値段 | ○ | × | 余り |\n```\n\n```mermaid\ngraph TD; A-->B\n```\n"},{"name":"10_no_diagram.md","title":"no_diagram：図のない資料（架空の例）","text":"# 図のない資料（架空の例）\n> ひとことで：図の書き方がない md は、文だけを整えて出す\n\n## 背景\nいまの手順は紙で回している。\n\n## 進め方\n1. まず現状を調べる\n2. 次に案を作る\n3. 最後に決める\n\n| 項目 | 内容 |\n|---|---|\n| 期間 | 3か月 |\n| 人数 | 4人 |\n"}];

    if (it.dateText) extra.push('日付：' + esc(it.dateText) + (it.end ? '（' + esc(it.end) + ' まで）' : ''));
    if (it.valueText) extra.push('数字：' + esc(it.valueText) + (diag.unit ? '（' + esc(diag.unit) + '）' : '') + (it.note ? '\u3000' + esc(it.note) : ''));
    if (it.lane) extra.push('担当：' + esc(it.lane));
    if (it.cells) extra.push(diag.options.map(function (o, j) { return esc(o) + '：' + esc(it.cells[j].text || '－'); }).join('<br>'));
    if (diag.edges) {
      var outs = diag.edges.filter(function (e) { return e.from === it.id; }).map(function (e) { return esc(diag.items[e.to].label) + (e.label ? '（' + esc(e.label) + '）' : ''); });
      var ins = diag.edges.filter(function (e) { return e.to === it.id; }).map(function (e) { return esc(diag.items[e.from].label); });
      if (ins.length) extra.push('前：' + ins.join('・'));
      if (outs.length) extra.push('次：' + outs.join('・'));
    }
    if (extra.length) h += '<p>' + extra.join('<br>') + '</p>';
    h += n && n.lines.length ? md(n.lines) : '<p class="empty">説明は md に書かれていません（「## ' + esc(it.label) + '」の下に書くと、ここに出ます）。</p>';
    h += it.sources.length ? '<div class="src"><b>出どころ</b><br>' + it.sources.map(esc).join('<br>') + '</div>' : '<p class="empty">出どころは書かれていません。</p>';
    h += '<p class="empty">md の ' + it.line + ' 行目</p>';
    $('panelBody').innerHTML = h;
    $('panel').hidden = false;
  }
  function closePanel() {
    $('panel').hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll('.item.sel'), function (e) { e.classList.remove('sel'); });
    state.sel = null;
  }

  // ---- 印刷（PDF）用のページ。いつも作っておく（Ctrl+P でも同じものが出る） ----
  function buildPrint(doc) {
    var pages = [], t = esc(title(doc)), hn = hasNoteFn(doc), td = today();
    var cover = '<h1>' + t + '</h1><div class="cards">' + cardsHtml(doc) + '</div>';
    if (doc.diagrams.length) cover += '<div class="p-list"><b>図</b><ol>' + doc.diagrams.map(function (d) { return '<li>' + esc(d.name || P.TYPES[d.type].label) + '（' + P.TYPES[d.type].label + '）</li>'; }).join('') + '</ol></div>';
    pages.push(cover);
    doc.diagrams.forEach(function (d, i) {
      var legend = legendItems(doc, [d]).join('\u3000');
      pages.push('<h2>' + esc(d.name || P.TYPES[d.type].label) + '（' + P.TYPES[d.type].label + '）</h2><div class="p-fig">' +
        R.svg(d, i, { fs: 15, today: td, hasNote: hn }) + '</div>' + (legend ? '<div class="p-legend">' + legend + '</div>' : ''));
    });
    // 箱の説明と出どころ、本文。ページからあふれないよう文字数で分け、長い1つは行で（長い行は字で）切る
    function lineText(l) { return l.code ? l.code.join('\n') : l.text; }
    function paginate(head, blocks) {
      var budget = 1400, cur = '', used = 0;
      function flush() { if (cur) pages.push('<h2>' + head + '</h2>' + cur); cur = ''; used = 0; }
      blocks.forEach(function (b) {
        var rows = [];
        b.text.split('\n').forEach(function (ln) { for (var p = 0; p === 0 || p < ln.length; p += 600) rows.push(ln.slice(p, p + 600)); });
        var first = true;
        while (rows.length || first) {
          var part = [], cost = 120;
          while (rows.length && (!part.length || cost + rows[0].length + 40 <= budget - used)) { cost += rows[0].length + 40; part.push(rows.shift()); }
          if (used && used + cost > budget) { rows = part.concat(rows); flush(); continue; }   // 次のページへ（取った行は戻す）
          cur += '<div class="p-note">' + (b.title ? '<h3>' + esc(b.title) + (first ? '' : '（つづき）') + '</h3>' : '') +
            (part.join('').trim() ? '<div>' + part.map(esc).join('<br>') + '</div>' : '') +
            (!rows.length && b.src ? '<div class="src">' + esc(b.src) + '</div>' : '') + '</div>';
          used += cost; first = false;
          if (rows.length) flush();
        }
      });
      flush();
    }
    var notes = [], seen = {};
    doc.diagrams.forEach(function (d) {
      d.items.forEach(function (it) {
        var n = noteFor(it.key);
        if ((!(n && n.lines.length) && !it.sources.length) || seen[it.key]) return;
        seen[it.key] = true;
        notes.push({ title: it.label, text: n ? n.lines.map(lineText).join('\n').trim() : '', src: it.sources.length ? '出どころ：' + it.sources.join('／') : '' });
      });
    });
    paginate('箱の説明と出どころ', notes);
    paginate('本文', doc.body.map(function (b) { return { title: b.heading || '', text: b.lines.map(lineText).join('\n').trim(), src: '' }; })
      .filter(function (b) { return b.title || b.text; }));
    var N = pages.length;
    $('print').innerHTML = pages.map(function (p, i) {
      return '<section class="page">' + (doc.secret ? '<div class="p-secret">' + esc(doc.secret) + '</div>' : '') + p +
        '<div class="p-foot"><span>' + t + '</span><span>' + (i + 1) + ' / ' + N + '</span></div></section>';
    }).join('');
    // 図をページの枠（約 1000×560px）に合わせる。小さい図は大きくしすぎない（1.6 倍まで）
    Array.prototype.forEach.call($('print').querySelectorAll('.p-fig svg'), function (s) {
      var w = +s.getAttribute('data-w'), h = +s.getAttribute('data-h'), k = Math.min(1000 / w, 560 / h, 1.6);
      s.setAttribute('width', Math.round(w * k)); s.setAttribute('height', Math.round(h * k));
    });
  }

  // ---- コピー（file:// でも動くよう、だめなら古いやり方で） ----
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  // ---- つなぐ ----
  $('pickLabel').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
  $('file').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
  SAMPLES.forEach(function (s, i) {
    var o = document.createElement('option'); o.value = String(i); o.textContent = s.title; $('sample').appendChild(o);
  });
  $('sample').addEventListener('change', function (e) {
    var s = SAMPLES[+e.target.value];
    if (s) show(s.text, s.name, '見本', '');
    e.target.value = '';
  });
  Array.prototype.forEach.call(document.querySelectorAll('.fs'), function (b) {
    b.addEventListener('click', function () {
      state.fs = +b.getAttribute('data-fs');
      Array.prototype.forEach.call(document.querySelectorAll('.fs'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      document.documentElement.style.setProperty('--fs', state.fs + 'px');
      var sel = state.sel;
      render();
      if (sel) openItem(sel.d, sel.i);
    });
  });
  $('pdf').addEventListener('click', function () {
    if (!state.doc) return;
    toast('印刷の窓で、送り先を「PDF に保存」に、用紙を「A4・横」にしてください', 7000);
    setTimeout(function () {
      try { window.print(); } catch (e) { showError('印刷を始められませんでした：' + e.message); }
    }, 300);
  });
  $('copyPrompt').addEventListener('click', function () {
    copyText(PROMPT).then(function (ok) {
      if (ok) toast('Copilot 用の指示をコピーしました。Copilot に貼り、続けて資料を渡してください');
      else showError('コピーできませんでした。copilot-prompt.md を開いて、中身をコピーしてください。');
    });
  });
  $('diagrams').addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('.item');
    if (g) openItem(+g.getAttribute('data-d'), +g.getAttribute('data-i'));
  });
  $('diagrams').addEventListener('keydown', function (e) {
    var g = e.target.closest && e.target.closest('.item');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openItem(+g.getAttribute('data-d'), +g.getAttribute('data-i')); }
  });
  $('panelClose').addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  // ドラッグ＆ドロップ（どこに落としても読む。ほかのページに移らないようにする）
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; $('drop').hidden = false; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; $('drop').hidden = true;
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  window.DocVisualizer = { version: '0.1.0' };
})();

</script>
</body>
</html>
